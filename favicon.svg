<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cyberGrad)" stroke="#4fd8ff" stroke-width="2.5" />
  
  <!-- Cyber accent node -->
  <circle cx="50" cy="14" r="3" fill="#39ff8a" filter="url(#glow)" />
  
  <!-- Terminal Chevron > -->
  <path d="M 17 21 L 31 32 L 17 43" fill="none" stroke="#4fd8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Terminal Underscore Cursor _ -->
  <path d="M 36 43 L 48 43" fill="none" stroke="#39ff8a" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
</svg>
