name: Update TryHackMe Stats

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        run: node scripts/scrape-thm-stats.js

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug-screenshot.png

      - name: Commit updated stats (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- thm-stats.json; then
            git add thm-stats.json
            git commit -m "chore: update TryHackMe stats [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to thm-stats.json — skipping commit."
          fi