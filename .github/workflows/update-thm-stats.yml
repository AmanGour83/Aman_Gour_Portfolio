name: Update TryHackMe Stats

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install puppeteer@22

      - name: Run scraper
        run: node scripts/scrape-thm-stats.js

      - name: Commit updated stats (if changed)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add thm-stats.json
          git diff --staged --quiet || git commit -m "chore: update TryHackMe stats [skip ci]"
          git pull --rebase origin main
          git push